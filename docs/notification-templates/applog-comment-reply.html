<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>你的评论收到了新回复</title>
  </head>
  <body style="margin:0;background:#f5f5f5;color:#222;font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f5f5;padding:24px 12px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#fff;border-radius:12px">
          <tr><td style="padding:32px">
            <h1 style="margin:0 0 20px;font-size:22px">你的评论收到了新回复</h1>
            <p style="margin:0 0 16px;line-height:1.7">{{parentCommenterName}}，{{replierName}} 回复了你在{{targetType}}《{{targetTitle}}》下的评论。</p>
            <p style="margin:20px 0 8px;color:#666">你的评论</p>
            <blockquote style="margin:0 0 20px;padding:14px 16px;background:#f7f7f8;border-left:4px solid #aaa;line-height:1.7">{{parentCommentExcerpt}}</blockquote>
            <p style="margin:20px 0 8px;color:#666">新回复</p>
            <blockquote style="margin:0;padding:14px 16px;background:#f7f7f8;border-left:4px solid #777;line-height:1.7">{{replyExcerpt}}</blockquote>
            <p style="margin:24px 0 0"><a href="{{viewUrl}}" style="display:inline-block;padding:11px 18px;border-radius:8px;background:#222;color:#fff;text-decoration:none">查看回复</a></p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
