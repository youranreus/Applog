<div style="max-width:560px;margin:32px auto;padding:0 20px 24px;background:#ffffff;border-top:4px solid #2563eb;box-shadow:0 2px 8px rgba(15,23,42,.12);color:#475569;font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.8">
  <h2 style="margin:0;padding:18px 4px 14px;border-bottom:1px solid #e2e8f0;color:#0f172a;font-size:18px;font-weight:600">
    <span style="color:#2563eb">›</span> 你的评论收到了新回复
  </h2>
  <div style="padding:18px 4px 0">
    <p style="margin:0 0 16px">{{parentCommenterName}}，<strong style="color:#0f172a">{{replierName}}</strong> 回复了你在{{targetType}}《<span style="color:#2563eb">{{targetTitle}}</span>》下的评论。</p>
    <p style="margin:16px 0 6px;color:#94a3b8;font-size:12px">你的评论</p>
    <p style="margin:0;padding:12px 16px;background:#f8fafc;border-left:3px solid #94a3b8;color:#64748b">{{parentCommentExcerpt}}</p>
    <p style="margin:18px 0 6px;color:#2563eb;font-size:12px">新回复</p>
    <p style="margin:0;padding:12px 16px;background:#eff6ff;border-left:3px solid #2563eb;color:#1e3a5f">{{replyExcerpt}}</p>
    <p style="margin:20px 0 0"><a href="{{viewUrl}}" target="_blank" style="display:inline-block;padding:9px 18px;background:#2563eb;color:#ffffff;text-decoration:none;font-weight:600">查看回复</a></p>
    <p style="margin:22px 0 0;color:#94a3b8;font-size:12px">此邮件由 AppLog 评论系统自动发送，请勿直接回复。</p>
  </div>
</div>
