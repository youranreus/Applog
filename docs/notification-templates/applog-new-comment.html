<div style="max-width:560px;margin:32px auto;padding:0 20px 24px;background:#ffffff;border-top:4px solid #2563eb;box-shadow:0 2px 8px rgba(15,23,42,.12);color:#475569;font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;line-height:1.8">
  <h2 style="margin:0;padding:18px 4px 14px;border-bottom:1px solid #e2e8f0;color:#0f172a;font-size:18px;font-weight:600">
    <span style="color:#2563eb">›</span> {{siteName}} 收到新评论
  </h2>
  <div style="padding:18px 4px 0">
    <p style="margin:0 0 8px"><strong style="color:#0f172a">{{commenterName}}</strong> 评论了{{targetType}}：</p>
    <p style="margin:0 0 16px;color:#2563eb">《{{targetTitle}}》</p>
    <p style="margin:16px 0;padding:12px 16px;background:#f8fafc;border-left:3px solid #2563eb;color:#334155">{{commentExcerpt}}</p>
    <p style="margin:20px 0 0"><a href="{{adminUrl}}" target="_blank" style="display:inline-block;padding:9px 18px;background:#2563eb;color:#ffffff;text-decoration:none;font-weight:600">前往评论管理</a></p>
    <p style="margin:22px 0 0;color:#94a3b8;font-size:12px">来自 {{siteName}} 的自动通知，请在管理后台处理评论。</p>
  </div>
</div>
