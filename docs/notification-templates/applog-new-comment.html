<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>新评论提醒</title>
  </head>
  <body style="margin:0;background:#f5f5f5;color:#222;font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f5f5;padding:24px 12px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#fff;border-radius:12px">
          <tr><td style="padding:32px">
            <h1 style="margin:0 0 20px;font-size:22px">{{siteName}} 收到新评论</h1>
            <p style="margin:0 0 16px;line-height:1.7">{{commenterName}} 在{{targetType}}《{{targetTitle}}》下提交了评论。</p>
            <blockquote style="margin:20px 0;padding:14px 16px;background:#f7f7f8;border-left:4px solid #777;line-height:1.7">{{commentExcerpt}}</blockquote>
            <p style="margin:24px 0 0"><a href="{{adminUrl}}" style="display:inline-block;padding:11px 18px;border-radius:8px;background:#222;color:#fff;text-decoration:none">前往评论管理</a></p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
