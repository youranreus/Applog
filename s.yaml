edition: 3.0.0
name: web-framework-app
access: "undefined"
vars:
  region: "cn-shenzhen"
  functionName: "applog-serverless"
resources:
  applog:
    component: fc3
    actions:
      pre-deploy:
        - run: export PATH=/usr/local/versions/node/v20.8.1/bin:$PATH && corepack enable && pnpm install
          path: .
        - run: export PATH=/usr/local/versions/node/v20.8.1/bin:$PATH && corepack enable && pnpm build:be
          path: .
    props:
      region: ${vars.region}
      description: applog
      runtime: custom.debian10
      cpu: 0.35
      diskSize: 512
      memorySize: 512
      timeout: 6
      layers:
        - acs:fc:${vars.region}:official:layers/Nodejs20/versions/1
      environmentVariables:
        PATH: >-
          /opt/nodejs20/bin:/usr/local/bin/apache-maven/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/ruby/bin
        OIDC_ISSUER: ${env(OIDC_ISSUER)}
        OIDC_CLIENT_ID: ${env(OIDC_CLIENT_ID)}
        OIDC_CLIENT_SECRET: ${env(OIDC_CLIENT_SECRET)}
        OIDC_REDIRECT_URI: ${env(OIDC_REDIRECT_URI)}
        OIDC_SESSION_SECRET: ${env(OIDC_SESSION_SECRET)}
        APP_SECRET_ENCRYPTION_KEY: ${env(APP_SECRET_ENCRYPTION_KEY)}
        FRONT_URL: ${env(FRONT_URL)}
        MYSQL_SERVER: ${env(MYSQL_SERVER)}
        MYSQL_PORT: ${env(MYSQL_PORT)}
        MYSQL_USER: ${env(MYSQL_USER)}
        MYSQL_PASSWORD: ${env(MYSQL_PASSWORD)}
        MYSQL_DATABASE: ${env(MYSQL_DATABASE)}
        SALTROUND: ${env(SALTROUND)}
        TOKEN_SECRET: ${env(TOKEN_SECRET)}
      customRuntimeConfig:
        command:
          - ./start-backend
        port: 4000
      functionName: applog-serverless
      code: .
      logConfig: auto
      triggers:
        - triggerName: http-trigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - HEAD
              - OPTIONS
  garmin_sync:
    component: fc3
    props:
      region: ${vars.region}
      functionName: applog-garmin-sync
      description: Read-only Garmin activity snapshot worker
      runtime: python3.12
      code: ./workers/garmin-sync
      handler: index.handler
      cpu: 0.5
      diskSize: 512
      memorySize: 512
      timeout: 300
      internetAccess: true
      logConfig: auto
      environmentVariables:
        PYTHONUSERBASE: /code/python
        PYTHONPATH: /code/src:/code/python
        GARMIN_IS_CN: ${env(GARMIN_IS_CN)}
        GARMIN_TIME_ZONE: ${env(GARMIN_TIME_ZONE)}
        APP_SECRET_ENCRYPTION_KEY: ${env(APP_SECRET_ENCRYPTION_KEY)}
        GARMIN_PRIVATE_ARCHIVE_ENABLED: ${env(GARMIN_PRIVATE_ARCHIVE_ENABLED)}
        GARMIN_HEALTH_BACKFILL_ENABLED: ${env(GARMIN_HEALTH_BACKFILL_ENABLED)}
        GARMIN_MAP_COVERS_ENABLED: ${env(GARMIN_MAP_COVERS_ENABLED)}
        GARMIN_REQUEST_BUDGET: ${env(GARMIN_REQUEST_BUDGET)}
        GARMIN_HEALTH_EMPTY_DAY_LIMIT: ${env(GARMIN_HEALTH_EMPTY_DAY_LIMIT)}
        MYSQL_SERVER: ${env(MYSQL_SERVER)}
        MYSQL_PORT: ${env(MYSQL_PORT)}
        MYSQL_USER: ${env(MYSQL_USER)}
        MYSQL_PASSWORD: ${env(MYSQL_PASSWORD)}
        MYSQL_DATABASE: ${env(MYSQL_DATABASE)}
      triggers:
        - triggerName: garmin-sync-every-30-minutes
          triggerType: timer
          triggerConfig:
            cronExpression: "@every 30m"
            enable: false
            payload: "{}"
