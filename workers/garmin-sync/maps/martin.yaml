listen_addresses: 127.0.0.1:3000
on_invalid: abort
cache:
  size_mb: 256
pmtiles:
  directory_cache:
    size_mb: 64
  sources:
    basemap: ${APPLOG_MAP_RELEASE_DIR}/basemap.pmtiles
fonts:
  cache:
    size_mb: 32
  paths:
    - ${APPLOG_MAP_RELEASE_DIR}/fonts
styles:
  rendering: true
  sources:
    applog-light: ${APPLOG_MAP_RELEASE_DIR}/style.json
